<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{background:#121c31;color:#f4f5ff;font:15px system-ui;padding:15px} canvas{width: min(96vw,960px);image-rendering:pixelated;aspect-ratio:16/9;background:black}select,input{font-size:17px;margin:12px 0}</style></head><body><h2>Irreverents BKG-02 · 320×180 background viewport</h2><select id="biome"></select><p>Horizontal camera position: <span id="n">0</span> / 704</p><input id="x" type="range" min="0" max="704" value="0" step="1" style="width:min(96vw,960px)"><br><canvas id="canvas" width="320" height="180"></canvas><script>const names=["forest_ruins_day","market_town_day","ice_cavern_ruins","volcanic_forge_sunset","moonlit_stronghold","sky_isles_day"];const c=document.querySelector('#canvas'),ctx=c.getContext('2d'),sel=document.querySelector('#biome'),slider=document.querySelector('#x'),n=document.querySelector('#n');let im=new Image();names.forEach(n=>{let o=document.createElement('option');o.text=n;sel.add(o)});function load(){im.src='../backgrounds/'+sel.value+'_1024x180.png'}function draw(){if(!im.complete||!im.naturalWidth)return;ctx.imageSmoothingEnabled=false;ctx.drawImage(im,Number(slider.value),0,320,180,0,0,320,180);n.textContent=slider.value}im.onload=draw;sel.onchange=load;slider.oninput=draw;load()</script></body></html>
