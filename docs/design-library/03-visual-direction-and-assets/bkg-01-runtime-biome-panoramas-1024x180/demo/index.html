<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Irreverents • Biome background QA</title><style>body{font:14px system-ui;background:#111727;color:white;padding:12px;margin:0}main{max-width:950px;margin:auto}canvas{background:#232b40;width:100%;aspect-ratio:16/9;image-rendering:pixelated;border:2px solid #8393b8;border-radius:6px}.row{display:flex;gap:12px;align-items:center;margin:12px 0;flex-wrap:wrap}select,input,button{font:inherit;padding:9px;border-radius:6px}input[type=range]{flex:1;min-width:160px}small{color:#aab7ce}button{touch-action:manipulation}</style></head><body><main><h2>BKG-01 • Biome panorama QA</h2><p>Exact 320×180 game viewport. Use the slider to pan across a single 1024×180 PNG.</p><div class="row"><select id="biome"><option value="ruins_day">Sunlit Ruins</option>
<option value="forest_waterfall">Forest Waterfall</option>
<option value="ice_cavern">Ice Cavern</option>
<option value="sky_islands_sunset">Sky Islands at Sunset</option>
<option value="moonlit_castle">Moonlit Castle</option>
<option value="volcanic_forge">Volcanic Forge</option>
<option value="market_town_day">Market Town</option>
<option value="iron_quarry_evening">Iron Quarry</option></select><button id="prev">◀</button><input id="pan" type="range" min="0" max="704" value="352" step="1"><button id="next">▶</button><span id="value">352/704</span></div><canvas id="game" width="320" height="180"></canvas><p><small>These are flat scenes, not collision tiles or separated parallax layers. Scale the canvas, not the underlying PNG. The 8 available images are in the backgrounds/ folder.</small></p></main><script>
const data=Object.fromEntries([["ruins_day", "../backgrounds/ruins_day_1024x180.png"], ["forest_waterfall", "../backgrounds/forest_waterfall_1024x180.png"], ["ice_cavern", "../backgrounds/ice_cavern_1024x180.png"], ["sky_islands_sunset", "../backgrounds/sky_islands_sunset_1024x180.png"], ["moonlit_castle", "../backgrounds/moonlit_castle_1024x180.png"], ["volcanic_forge", "../backgrounds/volcanic_forge_1024x180.png"], ["market_town_day", "../backgrounds/market_town_day_1024x180.png"], ["iron_quarry_evening", "../backgrounds/iron_quarry_evening_1024x180.png"]]);const sel=document.querySelector('#biome'),range=document.querySelector('#pan'),cv=document.querySelector('#game'),ctx=cv.getContext('2d');let im=new Image();ctx.imageSmoothingEnabled=false;function render(){ctx.clearRect(0,0,320,180);if(im.complete&&im.naturalWidth===1024)ctx.drawImage(im,-Number(range.value),0);document.querySelector('#value').textContent=range.value+'/704'}function load(){im=new Image();im.onload=render;im.src=data[sel.value]}range.addEventListener('input',render);sel.addEventListener('change',load);document.querySelector('#prev').onclick=()=>{range.value=Math.max(0,+range.value-80);render()};document.querySelector('#next').onclick=()=>{range.value=Math.min(704,+range.value+80);render()};load();
</script></body></html>
