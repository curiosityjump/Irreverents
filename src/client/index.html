<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- INTENT: the scale is fixed and the page covers the notch area; the game surface must never zoom, scroll or bounce on an iPhone (D-093). -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="build" content="%COMMIT%">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Irreverents</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden;
    background: #0f0f1c; color: #f4f1de; font: 14px/1.4 system-ui, -apple-system, sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  /* 320x180, sized by src/client/shell.ts to a whole number of device pixels per game pixel. */
  #game { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; background: #1b1b2f; display: block; touch-action: none; }
  #status { position: absolute; left: 0; right: 0; top: 6px; top: max(6px, env(safe-area-inset-top)); text-align: center; pointer-events: none; }
  #status span { display: inline-block; padding: 3px 10px; border-radius: 10px; background: rgba(15, 15, 28, .8); }
  #status[hidden], #touch[hidden] { display: none; }

  /* Read by src/client/shell.ts to learn the notch and home-bar insets. */
  #safe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  /* DRAFT: the touch layout: a left/right pad under the left thumb, one button per action under the right. src/client/shell.ts places the two zones beside the view (sideways) or below it (upright), or over its bottom corners where a 16:9 phone leaves no room (.over), and sizes everything.
     Quiet on purpose (docs/plan/step-5.md, "Controls never hide the game"): a control paints only its picture (the delivered U08-01 art, assets/ui/touch/) or, with no picture, a faint label or arrow; the touch area is much larger than what is painted; a press lights it up under the thumb. */
  #touch { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; }
  #pad, #actions button { pointer-events: auto; touch-action: none; box-sizing: border-box; border: 0; background: transparent; color: rgba(244, 241, 222, .7); }
  #pad { position: absolute; left: var(--lz-left, 14px); width: var(--lz-width, 156px); bottom: var(--bottom, 14px); height: var(--pad-h, 76px); display: flex; }
  #pad i { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; border-radius: 14px; }
  #pad i::before { content: ""; border: 9px solid transparent; opacity: .6; filter: drop-shadow(0 0 1px #0f0f1c); }
  #pad i.l::before { border-right-color: rgba(244, 241, 222, .8); margin-right: 9px; }
  #pad i.r::before { border-left-color: rgba(244, 241, 222, .8); margin-left: 9px; }
  #pad i.art::before { display: none; }
  #pad i.on, #actions button.on { background: rgba(244, 241, 222, .25); color: #fff; }
  #pad i.on::before { opacity: 1; }
  #actions { position: absolute; left: var(--rz-left, auto); width: var(--rz-width, 180px); bottom: var(--bottom, 14px); display: flex; flex-wrap: wrap-reverse; flex-direction: row-reverse; gap: var(--gap, 8px); }
  #actions button { position: relative; width: var(--btn, 76px); height: var(--btn, 76px); border-radius: 14px; font: 600 12px/1 system-ui, -apple-system, sans-serif; text-shadow: 0 0 2px #0f0f1c, 0 1px 1px #0f0f1c; margin: 0; padding: 0; -webkit-appearance: none; appearance: none; overflow: hidden; }
  #actions button.art, #actions button.art.on { color: transparent; text-shadow: none; }
  /* The picture: a 48x24 strip (normal, pressed) shown one half at a time, at a whole number of device pixels per art pixel (shell.ts). It takes no touches: the control under it does. */
  .icon { display: none; position: absolute; left: var(--icon-off, 0); top: var(--icon-off, 0); width: var(--icon, 48px); height: var(--icon, 48px); background-repeat: no-repeat; background-size: 200% 100%; background-position: 0 0; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; opacity: .85; }
  #pad .icon { left: var(--pad-icon-x, 0); top: var(--pad-icon-y, 0); }
  .art > .icon { display: block; }
  .on > .icon { background-position: 100% 0; opacity: 1; }

  #hint { position: absolute; left: 0; right: 0; top: var(--hint-top, 200px); padding: 0 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; opacity: .85; text-align: center; }
  #hint[hidden] { display: none; }
  #hint button { pointer-events: auto; touch-action: manipulation; width: 32px; height: 32px; flex: none; border: 1px solid rgba(244, 241, 222, .45); border-radius: 50%; background: transparent; color: #f4f1de; font-size: 16px; line-height: 1; padding: 0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="touch" hidden></div>
<div id="status" hidden><span></span></div>
<div id="hint" hidden><span>Better sideways. If turning does nothing, switch off rotation lock.</span><button type="button" aria-label="Dismiss">&times;</button></div>
<div id="safe"></div>
<!-- INTENT: this script comes first and stands alone, in syntax every iPhone Safari reads, so that it still works when game.js fails to load or to parse (an older iOS), which is exactly when nobody could otherwise tell us what happened. It sends what went wrong to the server (GET /debug/errors lists it; src/server/errors.ts): the error, this page's build, the screen, the user-agent. INTENT: no personal data: never the player id, a name, or the room (anything after a "?" is cut from every string, since the room is in the address). DRAFT: at most 20 reports per page load. -->
<script>
(function () {
  var sent = 0;
  function clean(v, max) {
    return String(v == null ? '' : v).replace(/\?[^\s)'"]*/g, '').slice(0, max);
  }
  function report(kind, message, stack) {
    try {
      if (++sent > 20) return;
      var meta = document.querySelector('meta[name="build"]');
      var body = JSON.stringify({
        kind: kind,
        message: clean(message, 500),
        stack: clean(stack, 1500),
        build: meta ? meta.getAttribute('content') : '',
        screen: { w: window.innerWidth, h: window.innerHeight, dpr: window.devicePixelRatio || 1 },
        upright: window.innerHeight > window.innerWidth,
        ua: navigator.userAgent
      });
      var x = new XMLHttpRequest();
      x.open('POST', 'debug/errors', true);
      x.setRequestHeader('content-type', 'text/plain');
      x.send(body);
    } catch (e) { /* reporting must never break the page */ }
  }
  window.irreverentsReport = report;
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && t.tagName) {
      // A script, image or stylesheet that did not load.
      report('load', t.tagName.toLowerCase() + ' failed to load: ' + (t.src || t.href || ''), '');
    } else {
      report('error', (e.message || 'error') + ' (' + (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0) + ')', e.error && e.error.stack);
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    report('rejection', r && r.message ? r.message : String(r), r && r.stack);
  });
})();
</script>
<script src="game.js"></script>
</body>
</html>
